<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0b0f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ff5b3d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff5b3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd35c"/>
      <stop offset="50%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ff4d4d"/>
    </linearGradient>
    <linearGradient id="btnFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2740"/>
      <stop offset="100%" stop-color="#0e1424"/>
    </linearGradient>
    <linearGradient id="txtGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9d6ee"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#2a3652" stroke-width="1" opacity="0.35">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="350" y1="0" x2="350" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
  </g>

  <!-- glow behind clock -->
  <circle cx="960" cy="180" r="220" fill="url(#glow)"/>

  <!-- scattered particles -->
  <g fill="#ffb35c" opacity="0.6">
    <circle cx="80" cy="70" r="2.5"/>
    <circle cx="120" cy="290" r="2"/>
    <circle cx="720" cy="60" r="2"/>
    <circle cx="640" cy="300" r="2.5"/>
    <circle cx="1000" cy="50" r="2"/>
    <circle cx="1150" cy="300" r="2.5"/>
    <circle cx="60" cy="180" r="1.8"/>
  </g>

  <!-- big countdown clock / power ring -->
  <g transform="translate(960,180)">
    <circle r="130" fill="url(#btnFill)" stroke="#2f3d5c" stroke-width="2"/>
    <circle r="112" fill="none" stroke="#233047" stroke-width="10"/>
    <path d="M0,-112 A112,112 0 1 1 -79,79" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round"/>
    <!-- power icon -->
    <line x1="0" y1="-46" x2="0" y2="-4" stroke="#ffd88f" stroke-width="9" stroke-linecap="round"/>
    <path d="M -34,-24 A 46,46 0 1 0 34,-24" fill="none" stroke="#ffd88f" stroke-width="9" stroke-linecap="round"/>
    <!-- clock ticks -->
    <g stroke="#5b6c8f" stroke-width="3">
      <line x1="0" y1="-100" x2="0" y2="-90"/>
      <line x1="0" y1="100" x2="0" y2="90"/>
      <line x1="-100" y1="0" x2="-90" y2="0"/>
      <line x1="100" y1="0" x2="90" y2="0"/>
    </g>
  </g>

  <!-- countdown digits below clock -->
  <text x="960" y="330" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#ff9d5c" opacity="0.85" letter-spacing="2">00:29:57</text>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" fill="url(#txtGlow)">
    <tspan x="60" dy="0" textLength="720" lengthAdjust="spacingAndGlyphs">Auto Shutdown</tspan>
    <tspan x="60" dy="72" textLength="360" lengthAdjust="spacingAndGlyphs">Timer</tspan>
  </text>

  <!-- tagline -->
  <text x="60" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#9fb0d0" textLength="880" lengthAdjust="spacingAndGlyphs">
    Schedules automatic system shutdown with built-in countdown timer
  </text>
  <text x="60" y="294" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#6f84ab" textLength="300" lengthAdjust="spacingAndGlyphs">
    — single binary
  </text>

  <!-- accent underline -->
  <rect x="60" y="222" width="120" height="4" fill="#ff8a3d"/>
</svg>